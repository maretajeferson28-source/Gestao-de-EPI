<!-- Aviso à pessoa: o acesso foi liberado (infra/railway/app/avisos.mjs). -->
<div style="font-family:Arial,Helvetica,sans-serif;max-width:480px;margin:0 auto;padding:24px;color:#1f2937">
  <h2 style="margin:0 0 16px;font-size:20px">Gestão de <span style="color:#f97316">EPI</span></h2>
  <p style="margin:0 0 12px;font-size:15px;line-height:1.5">Olá{{ .Nome }},</p>
  <p style="margin:0 0 20px;font-size:15px;line-height:1.5">
    Seu acesso ao Gestão de EPI com o e-mail <strong>{{ .Email }}</strong> foi liberado. Já pode entrar.
  </p>
  <p style="margin:0 0 24px">
    <a href="{{ .Link }}" style="display:inline-block;background:#f97316;color:#ffffff;text-decoration:none;font-weight:bold;padding:12px 20px;border-radius:8px">Entrar no Gestão de EPI</a>
  </p>
  <p style="margin:0;font-size:13px;line-height:1.5;color:#6b7280">
    Entre com a mesma conta deste e-mail. Se não pediu esse acesso, ignore esta mensagem.
  </p>
</div>
