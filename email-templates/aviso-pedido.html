<!-- Aviso ao administrador: alguém pediu acesso (infra/railway/app/avisos.mjs). -->
<div style="font-family:Arial,Helvetica,sans-serif;max-width:480px;margin:0 auto;padding:24px;color:#1f2937">
  <h2 style="margin:0 0 16px;font-size:20px">Gestão de <span style="color:#f97316">EPI</span></h2>
  <p style="margin:0 0 12px;font-size:15px;line-height:1.5">Olá,</p>
  <p style="margin:0 0 20px;font-size:15px;line-height:1.5">
    <strong>{{ .Nome }}</strong> ({{ .Email }}) entrou no Gestão de EPI e está aguardando a liberação do acesso.
  </p>
  <p style="margin:0 0 24px">
    <a href="{{ .Link }}" style="display:inline-block;background:#f97316;color:#ffffff;text-decoration:none;font-weight:bold;padding:12px 20px;border-radius:8px">Abrir Autorizações</a>
  </p>
  <p style="margin:0;font-size:13px;line-height:1.5;color:#6b7280">
    No app, vá em Autorizações e ative o acesso dessa pessoa. Se não reconhecer o pedido, é só deixar desativado.
  </p>
</div>
