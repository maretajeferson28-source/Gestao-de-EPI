name: Sync CAEPI

on:
  # Agendamento suspenso até validar tamanho e carga no banco novo.
  workflow_dispatch:
    inputs:
      mode:
        description: Validar sem banco ou importar (exige liberação)
        type: choice
        options:
          - validate
          - import
        default: validate
        required: true

permissions:
  contents: read

concurrency:
  group: sync-caepi
  cancel-in-progress: false

jobs:
  sync-caepi:
    if: ${{ inputs.mode == 'validate' || vars.CAEPI_SYNC_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: America/Sao_Paulo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm 10.17.1
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Testar extrator e proteções
        run: node --test scripts/test-caepi-sync.mjs scripts/test-supabase-rebuild.mjs

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client xvfb

      - name: Sync CAEPI to Supabase
        env:
          # Secret novo e separado: não religar execuções antigas à base nova.
          SUPABASE_DB_URL: ${{ inputs.mode == 'import' && secrets.CAEPI_DB_URL || '' }}
          CAEPI_DRY_RUN: ${{ inputs.mode == 'import' && '0' || '1' }}
          CAEPI_SYNC_ENABLED: ${{ vars.CAEPI_SYNC_ENABLED }}
          CAEPI_DOWNLOAD_METHOD: browser
        run: |
          if [ "$CAEPI_DRY_RUN" != '1' ] && [ -z "$SUPABASE_DB_URL" ]; then
            echo "Configure o secret CAEPI_DB_URL do banco novo antes de executar."
            exit 1
          fi
          xvfb-run --auto-servernum node scripts/sync-caepi-to-supabase.mjs
