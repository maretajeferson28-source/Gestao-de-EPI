name: Sync CAEPI

on:
  # Agendamento suspenso até validar tamanho e carga no banco novo.
  workflow_dispatch:

concurrency:
  group: sync-caepi
  cancel-in-progress: false

jobs:
  sync-caepi:
    if: ${{ vars.CAEPI_SYNC_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: America/Sao_Paulo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm 10.17.1
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client xvfb

      - name: Sync CAEPI to Supabase
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          CAEPI_DOWNLOAD_METHOD: browser
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "Configure o secret SUPABASE_DB_URL do banco novo antes de executar."
            exit 1
          fi
          xvfb-run --auto-servernum node scripts/sync-caepi-to-supabase.mjs
