name: Export CAEPI Manufacturers PDF

on:
  push:
    paths:
      - '.github/workflows/export-caepi-manufacturers.yml'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      TZ: America/Sao_Paulo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client and ReportLab
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client fonts-dejavu-core
          python -m pip install --quiet reportlab

      - name: Export unique manufacturers from active CAEPI dataset
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          export SUPABASE_DB_URL="postgresql://postgres.aqnrjjllfzirrtwvjjbl:${SUPABASE_DB_PASSWORD}@aws-0-sa-east-1.pooler.supabase.com:5432/postgres?sslmode=require"
          psql "$SUPABASE_DB_URL" -At -c "
            with active as (
              select id
              from public.caepi_datasets
              where status='active'
              order by completed_at desc nulls last
              limit 1
            )
            select distinct trim(r.fabricante)
            from public.caepi_records r
            join active a on a.id=r.dataset_id
            where nullif(trim(r.fabricante),'') is not null
            order by 1 collate \"C\";
          " > manufacturers.txt

      - name: Generate PDF
        run: |
          cat > /tmp/make_pdf.py <<'PY'
          from pathlib import Path
          from reportlab.pdfgen import canvas
          from reportlab.lib.pagesizes import A4
          from reportlab.pdfbase import pdfmetrics
          from reportlab.pdfbase.ttfonts import TTFont
          from reportlab.lib.colors import HexColor

          names=[x.strip() for x in Path("manufacturers.txt").read_text(encoding="utf-8").splitlines() if x.strip()]
          out="fabricantes_caepi.pdf"
          W,H=A4
          margin=34
          header_h=52
          footer_h=24
          gap=18
          col_w=(W-2*margin-gap)/2
          line_h=11.2
          font_path="/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
          bold_path="/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          pdfmetrics.registerFont(TTFont("DV",font_path))
          pdfmetrics.registerFont(TTFont("DVB",bold_path))

          c=canvas.Canvas(out,pagesize=A4)
          c.setTitle("Fabricantes CAEPI")
          orange=HexColor("#ff6600")
          dark=HexColor("#151515")
          gray=HexColor("#707070")

          def header(page_no):
              c.setFillColor(dark)
              c.rect(0,H-header_h,W,header_h,fill=1,stroke=0)
              c.setFillColor(orange)
              c.setFont("DVB",14)
              c.drawString(margin,H-25,"FABRICANTES CAEPI")
              c.setFillColor(HexColor("#d0d0d0"))
              c.setFont("DV",7.5)
              c.drawRightString(W-margin,H-24,f"{len(names):,}".replace(",", ".")+" fabricantes distintos")
              c.setStrokeColor(orange)
              c.setLineWidth(1.2)
              c.line(margin,H-header_h+7,W-margin,H-header_h+7)
              c.setFillColor(gray)
              c.setFont("DV",6.5)
              c.drawCentredString(W/2,11,f"Base CAEPI ativa - lista alfabetica - pagina {page_no}")

          def fit_text(text,max_width,font="DV",size=7.0):
              if pdfmetrics.stringWidth(text,font,size)<=max_width:
                  return text
              ell="..."
              while text and pdfmetrics.stringWidth(text+ell,font,size)>max_width:
                  text=text[:-1]
              return text+ell

          y=H-header_h-11
          x=margin
          col=0
          page=1
          header(page)
          c.setFont("DV",7.0)
          c.setFillColor(HexColor("#222222"))

          for name in names:
              if y < footer_h+12:
                  if col==0:
                      col=1
                      x=margin+col_w+gap
                      y=H-header_h-11
                  else:
                      c.showPage()
                      page+=1
                      header(page)
                      c.setFont("DV",7.0)
                      c.setFillColor(HexColor("#222222"))
                      col=0
                      x=margin
                      y=H-header_h-11

              # subtle separator line and manufacturer name only
              c.setStrokeColor(HexColor("#e6e6e6"))
              c.setLineWidth(0.25)
              c.line(x,y-2,x+col_w,y-2)
              c.setFillColor(HexColor("#222222"))
              c.drawString(x,y,fit_text(name,col_w, "DV", 7.0))
              y-=line_h

          c.save()
          print(f"generated {out}: {len(names)} manufacturers, {page} pages")
          PY
          python /tmp/make_pdf.py

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: fabricantes-caepi
          path: fabricantes_caepi.pdf
          if-no-files-found: error
          retention-days: 1
